name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true

jobs:
  publish:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
      TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - name: Download generated formula
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/formula"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "nbocr.rb" \
            --dir "$RUNNER_TEMP/formula"
          ruby -c "$RUNNER_TEMP/formula/nbocr.rb"

      - name: Test formula installation
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew tap-new test/nbocr
          test_tap="$(brew --repository test/nbocr)"
          install -m 0644 "$RUNNER_TEMP/formula/nbocr.rb" \
            "$test_tap/Formula/nbocr.rb"
          brew install test/nbocr/nbocr
          nbocr --version
          brew uninstall nbocr
          brew untap test/nbocr

      - name: Configure scoped deploy key
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$RUNNER_TEMP/homebrew-tap-key"
          chmod 0600 "$RUNNER_TEMP/homebrew-tap-key"
          ssh-keyscan -p 443 -H ssh.github.com >> "$HOME/.ssh/known_hosts"

      - name: Publish formula to tap
        shell: bash
        env:
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/homebrew-tap-key -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          git clone ssh://git@ssh.github.com:443/zibo-chen/homebrew-tap.git \
            "$RUNNER_TEMP/homebrew-tap"
          install -d "$RUNNER_TEMP/homebrew-tap/Formula"
          install -m 0644 "$RUNNER_TEMP/formula/nbocr.rb" \
            "$RUNNER_TEMP/homebrew-tap/Formula/nbocr.rb"
          cd "$RUNNER_TEMP/homebrew-tap"
          if test -z "$(git status --porcelain -- Formula/nbocr.rb)"; then
            echo "Formula is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/nbocr.rb
          git commit -m "nbocr ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
